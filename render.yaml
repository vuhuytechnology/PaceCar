services:
  - type: web
    name: pacecar
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PACECAR_DEMO_LISTINGS_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
